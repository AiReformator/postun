# Dependabot version updates (free for public repos). Security updates are enabled in repository settings
# and ignore the cooldown. Cooldown gives the ecosystem time to pull a bad or compromised release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/" # npm workspaces share the root package-lock.json
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
