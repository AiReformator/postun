# Secretless CI for every PR, including forks (docs/04 §5, CI-01).
# No deploy, no remote D1, no Telegram, no production bindings. Never use pull_request_target here.
# Production deploys live in deploy.yml (main only, protected environment).
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build
      - run: npm run check:secrets
      - run: npm run check:logging
      - run: npm run check:docs
