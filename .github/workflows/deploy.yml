# Production deploy — the only path to production (docs/04 §5, docs/DEPLOY_RUNBOOK.md §5).
# Runs for pushes to main of this public repository, repeats the full CI, and deploys only after the maintainer
# approves the protected `production` environment (main only). The Cloudflare token and the real resource IDs are
# secrets of that environment; Worker secrets (encryption keys, sessions) stay in Cloudflare and never reach this
# workflow. Pull requests never run it, so untrusted code never sees these secrets.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: Workers to deploy
        type: choice
        default: changed
        options: [changed, all, admin, mcp, auth, web]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  verify:
    name: verify (full CI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
      - id: plan
        name: Which Workers changed since the last successful production deployment
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || 'changed' }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" --jq '.[].id'); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')"
            if [ "$state" = "success" ]; then base="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')"; break; fi
          done
          apps="$(node scripts/deploy/changed-apps.mjs "$MODE" "$base" "$HEAD_SHA")"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "last deployed: ${base:-none}; to deploy: ${apps:-nothing}"

  deploy:
    name: deploy to production
    needs: verify
    if: needs.verify.outputs.apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APPS: ${{ needs.verify.outputs.apps }}
      POSTUN_DOMAIN: ${{ vars.POSTUN_DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Render production configs
        env:
          POSTUN_KV_OAUTH_ID: ${{ secrets.POSTUN_KV_OAUTH_ID }}
          POSTUN_D1_CONTROL_ID: ${{ secrets.POSTUN_D1_CONTROL_ID }}
          POSTUN_D1_ADMIN_ID: ${{ secrets.POSTUN_D1_ADMIN_ID }}
        # APPS is a space-separated list validated by changed-apps.mjs; word splitting is intended.
        run: node scripts/deploy/render-wrangler.mjs $APPS
      - name: Apply D1 migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Public logs: keep wrangler output out of them; on failure show a redacted tail.
          quiet() {
            if ! "$@" > "$RUNNER_TEMP/wrangler.log" 2>&1; then
              sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<uuid>/g; s/[0-9a-f]{32}/<id>/g' "$RUNNER_TEMP/wrangler.log" | tail -n 40
              return 1
            fi
          }
          has() { case " $APPS " in *" $1 "*) return 0;; esac; return 1; }
          if has auth; then (cd apps/auth && quiet npx --no-install wrangler d1 migrations apply postun-control --remote --config wrangler.deploy.json); echo "migrated control"; fi
          if has admin; then (cd apps/admin && quiet npx --no-install wrangler d1 migrations apply postun-admin-meta --remote --config wrangler.deploy.json); echo "migrated admin"; fi
          for app in $APPS; do
            (cd "apps/$app" && quiet npx --no-install wrangler deploy --config wrangler.deploy.json)
            echo "deployed $app"
          done
      - name: Smoke checks
        run: node scripts/deploy/smoke.mjs $APPS
      - name: Remove rendered configs
        if: always()
        run: rm -f apps/*/wrangler.deploy.json
